<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00a0df"><title>次のアストラム</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
<header class="hero"><div><p class="eyebrow">astramline</p><h1>Next</h1><p id="clock" class="clock">--</p></div><button id="installButton" class="ghost hidden">ホームに追加</button></header>
<section class="card controls"><label><span>出発駅</span><select id="fromStation"></select></label><button id="swapButton" class="swap">⇅</button><label><span>到着駅</span><select id="toStation"></select></label><div class="button-row"><button id="favoriteButton">お気に入り登録</button><button id="reloadButton" class="secondary">時刻表再読込</button></div></section>
  <label>
  <span>検索時刻</span>
  <input id="searchTime" type="time">
</label>

<button id="useNowButton" class="secondary">現在時刻に戻す</button>
<section class="card result"><div class="result-head"><span id="serviceBadge" class="badge">--</span><span id="directionText" class="muted">--</span></div><h2 id="mainTrain">読み込み中...</h2><p id="subInfo" class="muted"></p><div id="nextList" class="next-list"></div><div class="fare" id="fareText">運賃 --</div></section>
<section class="card"><h3>お気に入り</h3><div id="favorites" class="favorites"></div></section>
<section class="card help"><h3>データ状況</h3><p id="dataStatus"></p><p class="muted">令和8年3月14日改正PDFからCSV化。到着時刻は同一trip_id行から参照します。</p></section>
</main><script src="./app.js"></script></body></html>
