<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00a0df"><title>Next</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
<header class="hero"><div><p class="eyebrow">astramline</p><h1>Next</h1><p id="clock" class="clock">--</p></div><button id="installButton" class="ghost hidden">ホームに追加</button></header>
<section class="card controls">
<div class="mode-toggle" role="tablist" aria-label="検索モード">
<button type="button" id="modeRoute" class="mode-btn active" role="tab" aria-selected="true">区間検索</button>
<button type="button" id="modeStation" class="mode-btn" role="tab" aria-selected="false">出発駅のみ指定</button>
</div>
<label><span id="fromStationLabel">出発駅</span><select id="fromStation"></select></label>
<button id="swapButton" class="swap route-only" type="button" aria-label="出発駅と到着駅を入れ替え">⇅</button>
<label class="route-only"><span>到着駅</span><select id="toStation"></select></label>
<div class="button-row"><button type="button" id="favoriteButton">お気に入り登録</button><button type="button" id="reloadButton" class="secondary">時刻表再読込</button></div>
</section>
<section class="card result"><div class="result-head"><span id="serviceBadge" class="badge">--</span><span id="directionText" class="muted">--</span></div><h2 id="mainTrain">読み込み中...</h2><p id="subInfo" class="muted"></p><div id="nextList" class="next-list"></div><div class="fare route-only" id="fareText">運賃 --</div></section>
<section class="card favorites-card"><h3>お気に入り</h3><ul id="favorites" class="favorite-list"></ul></section>
</main><script src="./app.js"></script></body></html>
